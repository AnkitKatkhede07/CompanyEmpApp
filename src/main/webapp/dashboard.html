<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body {
            background: #f4f6f9;
        }

        .topbar {
            background: linear-gradient(90deg, #0d6efd, #0b5ed7);
        }

        .sidebar-link {
            border-radius: 10px;
            margin-bottom: 8px;
            transition: 0.3s;
        }

        .sidebar-link:hover {
            background: #e9f2ff;
            transform: translateX(4px);
        }

        .main-card {
            border: none;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        .welcome-box {
            background: white;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body>

<!-- Top Navbar -->
<nav class="navbar navbar-dark topbar shadow-sm">
    <div class="container-fluid">
        <button class="btn btn-outline-light" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
            ☰ Menu
        </button>

        <span class="navbar-brand mx-auto fw-bold">Company Employee Info</span>

        <a href="login.html" class="btn btn-light btn-sm">Logout</a>
    </div>
</nav>

<!-- Sidebar -->
<div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMenu">
    <div class="offcanvas-header bg-primary text-white">
        <h5 class="offcanvas-title">Dashboard Menu</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
    </div>

    <div class="offcanvas-body">
        <div class="list-group">
            <a href="addEmployee" class="list-group-item list-group-item-action sidebar-link">
                Add Employee
            </a>
            <a href="viewEmployees" class="list-group-item list-group-item-action sidebar-link">
                View Employee
            </a>
            <a href="AddDept.html" class="list-group-item list-group-item-action sidebar-link">
                Add Department
            </a>
            <a href="viewDepartments" class="list-group-item list-group-item-action sidebar-link">
                View Department
            </a>
            <a href="login.html" class="list-group-item list-group-item-action text-danger sidebar-link">
                Logout
            </a>
        </div>
    </div>
</div>

<!-- Main Content -->
<div class="container py-5">
    <div class="welcome-box p-4 p-md-5 mb-4">
        <h1 class="fw-bold text-primary">Welcome to Dashboard</h1>
        <p class="text-muted mb-0">Manage employees and departments from one place.</p>
    </div>

    <div class="card main-card mb-4">
        <div class="card-body">
           <form action="viewEmployees" method="get" class="row g-2 align-items-center">
    <div class="col-md-10">
        <input type="text" name="keyword" class="form-control form-control-lg" placeholder="Search employee...">
    </div>
    <div class="col-md-2 d-grid">
        <button type="submit" class="btn btn-primary btn-lg">Search</button>
    </div>
</form>
        </div>
    </div>
     </div>


</body>
</html>
